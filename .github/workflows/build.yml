name: Build Mi 4c Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2
          git clone --depth=1 'https://github.com' toolchain64
          git clone --depth=1 'https://github.com' toolchain32

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$(pwd)/toolchain32/bin/arm-linux-androideabi-
          make O=out libra_defconfig
          make -j$(nproc) O=out Image.gz-dtb

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Mi4c-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
