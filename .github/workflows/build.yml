name: Build Mi 4c Kernel

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-mi4c-${{ github.sha }}
          restore-keys: ccache-mi4c-

      - name: Install dependencies & Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 clang llvm lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Compile Kernel
        run: |
          sed -i 's/-polly-opt-fusion=max//g' Makefile arch/arm64/Makefile
          sed -i 's/ -p / /g' Makefile arch/arm64/Makefile
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 libra_defconfig
          ./scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_FULL -e LTO_NONE
          make -j$(nproc) O=out ARCH=arm64 CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" Image.gz-dtb

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Mi4c-Kernel-Image
          path: out/arch/arm64/boot/Image.gz-dtb
